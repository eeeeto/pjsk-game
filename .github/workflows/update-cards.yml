name: update-cards

on:
  schedule:
    - cron: '30 */6 * * *'   # 每 6 小时检测一次上新
  workflow_dispatch:
    inputs:
      force:
        description: '强制全量补齐（忽略检测结果直接跑）'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: update-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --prefix tools

      - name: Detect & download new cards
        run: node tools/update-cards.mjs

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gacha-index.json assets/cardimg
          if git diff --cached --quiet; then
            echo "no updates"
          else
            git commit -m "自动更新卡面库：$(git diff --cached --name-only | grep -c cardimg) 个图片文件（$(date -u +%F %R UTC)）"
            git push
          fi
